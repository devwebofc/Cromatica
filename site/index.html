    <style>
      /* Loader: no HTML para aparecer antes do JavaScript carregar */
      .load {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #17171b;
        display: grid;
        place-content: center;
        justify-items: center;
        text-align: center;
        padding: 0 1.25rem;
        animation: loadOut 0.8s cubic-bezier(0.7, 0, 0.2, 1) 2.2s forwards;
        pointer-events: none;
        font-family: "Outfit", system-ui, sans-serif;
      }
      .load-mark {
        display: block;
        width: clamp(5.5rem, 22vw, 9rem);
        margin-bottom: 1.4rem;
        color: #e3000b;
        opacity: 0;
        transform: translateY(40%);
        animation: markRise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
      }
      .load b {
        position: relative;
        display: block;
        font: 900 clamp(3rem, 16vw, 9rem)/1 "Phudu", "Arial Black", Impact, sans-serif;
        letter-spacing: -0.01em;
        white-space: nowrap;
        color: transparent;
        -webkit-text-stroke: 2px #555;
      }
      /* Mesma caixa e alinhamento do contorno: o preenchimento fica exatamente por cima */
      .load b::after {
        content: attr(data-t);
        position: absolute;
        inset: 0;
        color: #e3000b;
        -webkit-text-stroke: 0;
        clip-path: inset(0 100% 0 0);
        animation: loadFill 1.9s cubic-bezier(0.6, 0, 0.3, 1) 0.2s forwards;
      }
      .load p {
        color: #bbb;
        margin: 1rem 0 0;
        font-size: clamp(0.95rem, 3.6vw, 1.125rem);
      }
      @keyframes markRise { to { opacity: 1; transform: none; } }
      @keyframes loadFill { to { clip-path: inset(0); } }
      @keyframes loadOut { to { transform: translateY(-100%); visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { .load { display: none; } }
    </style>
  </head>
  <body>
    <div class="load" aria-hidden="true">

      <b data-t="CROMÁTICA">CROMÁTICA</b>

    </div>
